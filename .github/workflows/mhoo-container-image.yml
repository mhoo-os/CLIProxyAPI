name: mhoo-container-image

on:
  push:
    branches:
      - mhoo/codex-websocket-interrupt-image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push multi-architecture image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cliproxyapi-mhoo
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          short_commit="${SOURCE_COMMIT:0:12}"
          docker buildx create --name mhoo-builder --use
          docker buildx build \
            --builder mhoo-builder \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="mhoo-${SOURCE_REF}" \
            --build-arg COMMIT="$SOURCE_COMMIT" \
            --build-arg BUILD_DATE="$build_date" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --push \
            --tag "$IMAGE:sha-${short_commit}" \
            --tag "$IMAGE:branch-${SOURCE_REF//\//-}" \
            .
          docker buildx imagetools inspect "$IMAGE:sha-${short_commit}"
